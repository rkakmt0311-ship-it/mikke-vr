<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3Dモデル確認</title>
<style>
  :root { --bg: #1b1814; --fg: #f3ead8; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, "Yu Gothic UI", sans-serif; overflow: hidden; }
  #info { position: fixed; left: 12px; top: 12px; background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.6; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/" } }</script>
</head>
<body>
<div id="info">読み込み中…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const file = new URLSearchParams(location.search).get('m') || 'assets/models/teddy.glb';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#2a241d');
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;
const sun = new THREE.DirectionalLight('#ffd9a8', 2.5); sun.position.set(2, 4, 3); sun.castShadow = true; scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: '#5a4632', roughness: 0.8 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100); cam.position.set(0.9, 0.7, 1.3);
const ctl = new OrbitControls(cam, r.domElement); ctl.target.set(0, 0.25, 0); ctl.enableDamping = true;
new GLTFLoader().load(file, g => {
  const m = g.scene, box = new THREE.Box3().setFromObject(m), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const s = 0.5 / size.y; m.scale.setScalar(s); m.position.set(-c.x * s, -box.min.y * s, -c.z * s);
  let tris = 0, texs = new Set(); m.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; for (const k in o.material) if (o.material[k]?.isTexture) texs.add(`${k} ${o.material[k].image?.width}px`); } });
  scene.add(m);
  document.getElementById('info').innerHTML = `${file}<br>ポリゴン数 ${Math.round(tris).toLocaleString()}<br>テクスチャ：${[...texs].join(' / ')}<br>ドラッグで回転・ホイールで拡大`;
}, undefined, e => document.getElementById('info').textContent = '読み込めませんでした：' + e.message);
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
r.setAnimationLoop(() => { ctl.update(); r.render(scene, cam); });
</script>
</body>
</html>
