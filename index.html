<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0a08">
<title>ミッケ！の せかいへ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
</head>
<body>
<!-- 紙の質感・線画アイコン（銅版画風、線幅1.2px） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .14  0 0 0 0 .1  0 0 0 0 .07  0 0 0 .08 0"/></filter>
  </defs>
  <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M6 4h10a2 2 0 0 1 2 2v11a3 3 0 0 0 3 3H9a3 3 0 0 1-3-3V4zM6 4a2 2 0 0 0-2 2v1h2M9 9h6M9 12h6M9 15h4"/></symbol>
  <symbol id="i-lens" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5 20 20M7 8a3.5 3.5 0 0 1 3-2"/></symbol>
  <symbol id="i-candle" viewBox="0 0 24 24"><path d="M12 3c-1.6 2-2.2 3.4-.6 5 1.6-1.6 1-3 .6-5zM9.5 10h5v10h-5zM7 21h10"/></symbol>
  <symbol id="i-ribbon" viewBox="0 0 24 24"><path d="M7 3h10v18l-5-4-5 4z"/></symbol>
</svg>

<!-- タイトル：0秒目の儀式（最初のタップで音を出せるようにする） -->
<div id="start">
  <div id="ignite">
    <button id="btn-ignite" aria-label="灯りを ともす">
      <svg viewBox="0 0 60 120" class="candle">
        <path class="flame" d="M30 8c-6 9-8 15-2 22 6-7 7-13 2-22z"/>
        <path class="wick" d="M30 30v8"/>
        <path class="body" d="M22 38h16v62H22zM22 46c3 2 6-2 8 0M16 104h28M12 110h36"/>
      </svg>
      <span class="whisper">灯りを ともして、屋根裏へ。</span>
    </button>
  </div>
  <div id="cover" hidden>
    <header class="title">
      <h1><span class="mikke">ミッケ！</span><span class="no">の せかいへ</span></h1>
      <p class="sub">― 眠らないおもちゃと、影の絵本 ―</p>
    </header>
    <nav class="page toc" aria-label="ひらきかた">
      <h2>ひらきかた</h2>
      <ol id="modes">
        <li id="li-xr" hidden><button id="btn-xr"><span class="num"></span><span class="lbl">ゴーグルで ひらく</span><em>Meta Quest</em></button></li>
        <li><button id="btn-pc"><span class="num"></span><span class="lbl">パソコンで ひらく</span><em>マウスと キーボード</em></button></li>
        <li><button id="btn-phone"><span class="num"></span><span class="lbl">スマホを のぞき窓に する</span><em>手で もって 見まわす</em></button></li>
        <li><button id="btn-phonevr"><span class="num"></span><span class="lbl">スマホを ゴーグルに 入れる</span><em>見つめる だけで あそぶ</em></button></li>
      </ol>
      <p id="xr-note" class="note"></p>
    </nav>
    <button class="ribbon" id="btn-settings" aria-label="音の ひびき と 歩きかた"><span class="txt">音の ひびき と 歩きかた</span></button>
  </div>
</div>

<!-- しおり：音・画質・そうさ -->
<div id="settings" class="sheet" hidden>
  <div class="page">
    <h2>音の ひびき と 歩きかた</h2>
    <label class="slider">せかいの おと<input type="range" id="vol-world" min="0" max="1" step="0.05"></label>
    <label class="slider">からくりの おと<input type="range" id="vol-sfx" min="0" max="1" step="0.05"></label>
    <label class="slider">おんがく<input type="range" id="vol-music" min="0" max="1" step="0.05"></label>
    <label class="slider">えの こまかさ
      <select id="quality"><option value="ultra">いちばん こまかく（PC）</option><option value="high">こまかく</option><option value="quest">ゴーグル むき</option><option value="mid">ふつう</option><option value="low">かるく</option></select>
    </label>
    <table class="howto">
      <tr><th></th><th>パソコン</th><th>ゴーグル</th><th>スマホ</th></tr>
      <tr><td>飛ぶ</td><td>W A S D</td><td>左スティック</td><td>足もとの「すすむ」</td></tr>
      <tr><td>上・下</td><td>Space ／ Shift</td><td>右スティック</td><td>見上げて すすむ</td></tr>
      <tr><td>ミッケ！</td><td>左クリック</td><td>右トリガー</td><td>じっと 見つめる</td></tr>
      <tr><td>からくり</td><td>右クリック ／ E</td><td>左トリガー</td><td>じっと 見つめる</td></tr>
      <tr><td>ルーペ</td><td>L</td><td>グリップ</td><td>足もとの「ルーペ」</td></tr>
      <tr><td>光の つぶ</td><td>H</td><td>A</td><td>足もとの「ヒント」</td></tr>
      <tr><td>しおり</td><td>Esc</td><td>Y</td><td>足もとの「メニュー」</td></tr>
    </table>
    <button class="close" data-close="settings">とじる</button>
  </div>
</div>

<!-- あそんでいる間の紙のメモ -->
<div id="hud" hidden>
  <div id="list" class="memo"></div>
  <div id="crosshair"></div>
  <div id="toast"><span class="big"></span><span class="murmur"></span></div>
  <div id="lens" hidden></div>
  <div id="lockmsg">画面を おすと、はじまるよ</div>
  <div id="phonebtns" hidden>
    <button data-act="list" aria-label="メモ"><svg><use href="#i-scroll"/></svg></button>
    <button data-act="lens" aria-label="ルーペ"><svg><use href="#i-lens"/></svg></button>
    <button data-act="hint" aria-label="光の つぶ"><svg><use href="#i-candle"/></svg></button>
    <button data-act="menu" aria-label="しおり"><svg><use href="#i-ribbon"/></svg></button>
  </div>
</div>

<div id="touch" hidden>
  <div id="joy"><div id="knob"></div></div>
  <div id="updown"><button id="btn-up" aria-label="うえへ">↑</button><button id="btn-down" aria-label="したへ">↓</button></div>
</div>

<!-- しおり（メニュー） -->
<div id="menu" class="sheet" hidden>
  <div class="page">
    <h2>しおり</h2>
    <div id="menu-pages"></div>
    <button data-menu="resume" class="primary">つづきを 読む</button>
    <button data-menu="hub">絵本の 部屋へ もどる</button>
    <button data-menu="settings">音の ひびき と 歩きかた</button>
    <label class="slider" hidden>えの こまかさ <select id="quality2"><option value="ultra">いちばん こまかく</option><option value="high">こまかく</option><option value="quest">ゴーグル むき</option><option value="mid">ふつう</option><option value="low">かるく</option></select></label>
    <button data-menu="quit">表紙に もどる</button>
  </div>
</div>

<div id="fade"></div>
<div id="loading">ページを めくっています……</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
